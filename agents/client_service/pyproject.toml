[project]
name = "client-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "ams-mcp-server",   # agent.py calls search_policy_docs
    "guardrails",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "voyageai>=0.6.0",
    "pypdf>=6.21.4",
    "boto3>=1.44.4",
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-core = { workspace = true }
ams-mcp-server = { workspace = true }
guardrails = { workspace = true }
